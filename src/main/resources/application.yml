server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: quadras-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quadrasdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:quadras_user}
    password: ${DB_PASSWORD:quadras123}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      ambiente: ${AMBIENTE:local}
  otlp:
    metrics:
      export:
        enabled: ${OTLP_ENABLED:false}
        url: ${OTLP_URL:}
        headers:
          Authorization: ${OTLP_AUTH:}
        step: 60s

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}